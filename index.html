<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Mission</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="particles"></div>

<div class="container">

    <div class="card">

        <div class="top">

            <div class="question-counter">
                Question <span id="current">1</span>/<span id="total">8</span>
            </div>

            <div class="progress">
                <div id="progress-fill"></div>
            </div>

        </div>

        <div id="content">

            <h1 class="title">
                Birthday Mission
            </h1>

            <p class="subtitle">
                Welcome Dad.
                A gift has been prepared.
                Access requires completion of a highly scientific questionnaire.
            </p>

            <button class="start-btn" onclick="startMission()">
                Begin
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
