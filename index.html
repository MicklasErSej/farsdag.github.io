<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Mission</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

    <div class="card">

        <h1>Birthday Mission</h1>

        <!-- PROGRESS BAR (NEVER DELETED) -->
        <div class="topbar">
            <div class="progress-track">
                <div class="progress-fill" id="questionBar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- ONLY THIS PART WILL CHANGE -->
        <div id="content">
            <p>
                Welcome Dad.<br>
                A gift is waiting for you.<br>
                Complete the short mission to unlock it.
            </p>

            <button id="startBtn">Begin</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
