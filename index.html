<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Mission</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="particles"></div>

<div class="container">

    <div class="card">

        <div id="content">

            <h1 class="title">Birthday Mission</h1>

            <p class="subtitle">
                Welcome Dad.<br>
                A gift is waiting.<br>
                Complete the mission to unlock it.
            </p>

            <button id="startBtn">Begin</button>

        </div>

        <div class="progress">
            <div id="progress-fill"></div>
        </div>

        <div class="question-counter">
            Question <span id="current">0</span>/<span id="total">0</span>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
