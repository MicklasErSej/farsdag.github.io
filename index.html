<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Bunker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="radar"></div>

<div class="container">

    <h1>🔒 OPERATION BUNKER</h1>

    <div class="mission-box">

        <div id="question">
            Welcome Agent Dad.<br>
            Your mission awaits...
        </div>

        <input
            type="text"
            id="answer"
            placeholder="Enter answer..."
        >

        <button onclick="nextQuestion()">
            Confirm
        </button>

        <div class="progress">
            <div id="bar"></div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
